name: NOVA Desktop Lite checks

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'web/**'
      - 'tests/**'
      - '*.ps1'
      - '*.bat'
      - 'requirements.txt'
      - '.github/workflows/expand-source.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'web/**'
      - 'tests/**'
      - '*.ps1'
      - '*.bat'
      - 'requirements.txt'
      - '.github/workflows/expand-source.yml'

permissions:
  contents: read

jobs:
  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse PowerShell scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $files = @('Start-NOVA.ps1','Install-NOVA-Prerequisites.ps1','Install-NOVA-Embeddings.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Host "Syntax errors in $file"
              $errors | Format-List | Out-String | Write-Host
              exit 1
            }
          }
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
