name: Expand and test NOVA source

on:
  push:
    branches: [main]
    paths:
      - 'NOVA-Desktop-3.0-core.b64.part*'
      - '.github/workflows/expand-source.yml'

permissions:
  contents: write

jobs:
  expand-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reassemble source archive
        run: |
          python - <<'PY'
          import base64, hashlib, pathlib
          root = pathlib.Path('.')
          parts = sorted(root.glob('NOVA-Desktop-3.0-core.b64.part*'))
          if not parts:
              raise SystemExit('Source archive parts are missing')
          data = base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True)
          expected = '5f659b42912cb2bd05c2595fb3b566b30b7ecaa25ce2ffb3e2c25a1ada477ec9'
          if hashlib.sha256(data).hexdigest() != expected:
              raise SystemExit('Source archive SHA-256 mismatch')
          pathlib.Path('NOVA-Desktop-3.0-core.tar.xz').write_bytes(data)
          PY
          tar -xJf NOVA-Desktop-3.0-core.tar.xz

      - name: Install test dependency
        run: python -m pip install -r requirements.txt

      - name: Run NOVA regression tests
        run: python -m unittest discover -s tests -v

      - name: Commit readable source files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app web tests
          if git diff --cached --quiet; then
            echo 'Source files already expanded.'
          else
            git commit -m 'Expand NOVA Desktop 3.0 source files'
            git push
          fi

  windows-smoke:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse the Windows launcher with Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'Start-NOVA.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Host
            exit 1
          }
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run backend tests on Windows
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
