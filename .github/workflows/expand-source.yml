name: Expand and test NOVA source

on:
  push:
    branches: [main]
    paths:
      - 'NOVA-Desktop-3.0-core.b64.part*'
      - '.github/workflows/expand-source.yml'

permissions:
  contents: write

jobs:
  expand-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reassemble source archive
        run: |
          python - <<'PY'
          import base64, hashlib, pathlib
          root = pathlib.Path('.')
          parts = sorted(root.glob('NOVA-Desktop-3.0-core.b64.part*'))
          if len(parts) != 6:
              raise SystemExit(f'Expected 6 source parts, found {len(parts)}')
          data = base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True)
          expected = 'a7089c2e86e5bf839b0524c68e1925db45f21cc61516b99258b4a7b58b9a31c2'
          if hashlib.sha256(data).hexdigest() != expected:
              raise SystemExit('Source archive SHA-256 mismatch')
          pathlib.Path('NOVA-Desktop-3.0-core.tar.xz').write_bytes(data)
          PY
          tar -xJf NOVA-Desktop-3.0-core.tar.xz

      - name: Install test dependency
        run: python -m pip install -r requirements.txt

      - name: Run NOVA regression tests
        run: python -m unittest discover -s tests -v

      - name: Commit readable source files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app web tests
          if git diff --cached --quiet; then
            echo 'Source files already expanded.'
          else
            git commit -m 'Expand NOVA Desktop 3.0 source files'
            git push
          fi
