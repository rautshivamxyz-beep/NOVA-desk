name: NOVA Desktop reliability checks

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'web/**'
      - 'tests/**'
      - 'Start-NOVA.ps1'
      - 'requirements.txt'
      - '.github/workflows/expand-source.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'web/**'
      - 'tests/**'
      - 'Start-NOVA.ps1'
      - 'requirements.txt'
      - '.github/workflows/expand-source.yml'

permissions:
  contents: read

jobs:
  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run backend tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v

  windows-smoke:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse the Windows launcher with Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'Start-NOVA.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Host
            exit 1
          }
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run backend tests on Windows
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
